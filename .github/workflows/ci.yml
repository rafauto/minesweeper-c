name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make CC=${{ matrix.compiler }}
      - name: Smoke test (play a full game with scripted input)
        run: |
          printf '1\n%.0s' $(seq 1 20) | timeout 10 ./minesweeper > out.txt || true
          grep -E "Perdeu|ganhou" out.txt
